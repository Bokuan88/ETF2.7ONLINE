<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多帳戶持股追蹤分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --ink: #161B22;
  --ink-soft: #5B6472;
  --ink-faint: #8A93A6;
  --line: #E2E5EA;
  --line-strong: #C9CEDA;
  --brand: #1F6F78;
  --brand-dark: #123F45;
  --brand-soft: #E3EFEF;
  --buy: #1E8E5A;
  --sell: #C1495B;
  --alert: #B9752A;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(15,23,32,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-size: 15px; font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif; -webkit-font-smoothing: antialiased; }

/* 版面佈局 */
.shell { display: flex; min-height: 100vh; flex-direction: row; }
.sidebar { width: 240px; flex: none; background: var(--brand-dark); color: #EAF2F1; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 10; }
.brand { padding: 22px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
.brand-title { font-size: 17px; font-weight: 600; letter-spacing: .2px; }
.brand-sub { font-size: 12px; color: #9FC4C0; margin-top: 5px; line-height: 1.5; }
nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 6px; color: #D9EAE8; background: transparent; border: none; text-align: left; font-size: 14.5px; cursor: pointer; width: 100%; transition: all 0.2s; }
.nav-item:hover { background: rgba(255,255,255,.08); }
.nav-item.active { background: var(--brand); color: #fff; font-weight: 600; }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.topbar h1 { font-size: 20px; margin: 0; font-weight: 600; }
.topbar .sub { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }

/* 視圖與卡片 */
.view { display: none; padding: 24px 28px 70px; }
.view.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; color: var(--ink); }
.hint { font-size: 13px; color: var(--ink-soft); line-height: 1.6; }

/* 網格與按鈕 */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #185a62; border-color: #185a62; }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* 帳戶清單樣式 */
.account-card { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; transition: border-color 0.2s; }
.account-card:hover { border-color: var(--brand); }
.meta { flex: 1; min-width: 0; }
.name-input { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.stat { font-size: 12px; color: var(--ink-soft); }

/* 表單 */
.filter-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
input[type=date], input[type=text] { border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 12px; font-size: 14px; font-family: inherit; background: #fff; }

/* ======== 手機版 RWD 響應式設定 ======== */
@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,.1); }
  .brand { padding: 12px 16px; }
  .brand-title { font-size: 16px; }
  .brand-sub { display: none; /* 手機版隱藏副標題節省空間 */ }
  nav { flex-direction: row; overflow-x: auto; padding: 8px 16px; gap: 8px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  .nav-item { width: auto; padding: 8px 14px; font-size: 14px; flex-shrink: 0; }
  
  .topbar { padding: 16px; position: static; }
  .view { padding: 16px 16px 40px; }
  .card { padding: 16px; }
  .grid { grid-template-columns: 1fr; } /* 手機版改為單行排列 */
  .filter-row { flex-direction: column; align-items: stretch; gap: 12px; }
  .btn { width: 100%; } /* 手機版按鈕滿版 */
}
</style>
</head>
<body>
<div class="shell">
  <!-- 側邊欄 / 手機版上方導覽列 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">持股追蹤儀表板</div>
      <div class="brand-sub">自動化 JSON 資料讀取分析</div>
    </div>
    <nav id="navList">
      <button class="nav-item active" data-view="import">📥 匯入資料</button>
      <button class="nav-item" data-view="overview">📊 總覽</button>
      <button class="nav-item" data-view="single">🔍 單一股分析</button>
      <button class="nav-item" data-view="compare">📈 股票比較</button>
      <button class="nav-item" data-view="alerts">⚠️ 警示設定</button>
      <button class="nav-item" data-view="prices">💰 股價設定</button>
    </nav>
  </aside>

  <!-- 主內容區 -->
  <main class="content">
    <header class="topbar">
      <div>
        <h1 id="topbarTitle">匯入資料</h1>
        <div class="sub" id="topbarSub">從 GitHub 雲端自動載入持股與股價資料</div>
      </div>
    </header>

    <!-- 視圖 1：匯入資料 -->
    <section class="view active" id="view-import">
      <div class="card">
        <h2>📁 雲端資料庫狀態</h2>
        <div id="dbStatus" class="hint" style="font-weight:600; color:var(--brand);">正在從雲端載入資料庫...</div>
      </div>

      <div class="card" id="accountsCard" style="display:none;">
        <div class="filter-row">
          <div class="field">
            <label>分析起始日期</label>
            <input type="date" id="importStartDate">
          </div>
          <div class="field">
            <label>分析結束日期</label>
            <input type="date" id="importEndDate">
          </div>
        </div>
      </div>

      <div class="card" id="accountsCard2" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;">
          <h2 style="margin: 0;">選擇要納入分析的帳戶</h2>
          <button class="btn btn-primary btn-sm" id="btnRunAnalysis">開始分析 →</button>
        </div>
        <div class="grid" id="accountsList"></div>
      </div>
    </section>

    <!-- 視圖 2：總覽 (預留框架) -->
    <section class="view" id="view-overview">
      <div class="card">
        <h2>資產總覽</h2>
        <p class="hint">分析結果將在此呈現。請先在「匯入資料」頁面點擊開始分析。</p>
        <div id="overviewContent" style="margin-top: 16px; color: var(--ink-soft);">
          尚未執行分析...
        </div>
      </div>
    </section>

    <!-- 視圖 3：單一股票分析 (預留框架) -->
    <section class="view" id="view-single">
      <div class="card">
        <h2>單一股票分析</h2>
        <p class="hint">請選擇要查看的股票代號。</p>
      </div>
    </section>

    <!-- 視圖 4：多股票比較 (預留框架) -->
    <section class="view" id="view-compare">
      <div class="card">
        <h2>多股票比較</h2>
        <p class="hint">比較不同 ETF/個股 的績效表現。</p>
      </div>
    </section>

    <!-- 視圖 5：警示中心 (預留框架) -->
    <section class="view" id="view-alerts">
      <div class="card">
        <h2>警示中心</h2>
        <p class="hint">查看停利停損或乖離率警示。</p>
      </div>
    </section>

    <!-- 視圖 6：股價設定 (預留框架) -->
    <section class="view" id="view-prices">
      <div class="card">
        <h2>股價資料庫</h2>
        <p class="hint">目前已載入的股價 JSON 狀態。</p>
      </div>
    </section>
  </main>
</div>
