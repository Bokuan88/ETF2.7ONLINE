<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多帳戶持股追蹤分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --ink:#161B22;
  --ink-soft:#5B6472;
  --ink-faint:#8A93A6;
  --line:#E2E5EA;
  --line-strong:#C9CEDA;
  --brand:#1F6F78;
  --brand-dark:#123F45;
  --brand-soft:#E3EFEF;
  --buy:#1E8E5A;
  --buy-soft:#E3F5EC;
  --sell:#C1495B;
  --sell-soft:#FBEAEC;
  --alert:#B9752A;
  --alert-soft:#FBEEDD;
  --focus:#3E7CB1;
  --radius:8px;
  --shadow:0 1px 2px rgba(15,23,32,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-size:15px;
  font-family:'IBM Plex Sans','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums; font-family:'IBM Plex Mono',ui-monospace,monospace;}
a{color:var(--brand-dark);}

.shell{display:flex; min-height:100vh;}
.sidebar{width:236px; flex:none; background:var(--brand-dark); color:#EAF2F1; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:5;}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.14);}
.brand-title{font-size:17px; font-weight:600; letter-spacing:.2px;}
.brand-sub{font-size:12px; color:#9FC4C0; margin-top:5px; line-height:1.6;}
nav{flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.nav-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:6px; color:#D9EAE8; background:transparent; border:none; text-align:left; font-size:14px; cursor:pointer; width:100%;}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:var(--brand); color:#fff; font-weight:600;}
.nav-badge{background:var(--alert); color:#fff; font-size:11px; padding:1px 7px; border-radius:999px; font-family:'IBM Plex Mono',monospace;}
.sidebar-foot{padding:14px 18px 18px; font-size:11.5px; color:#8FB6B2; line-height:1.7; border-top:1px solid rgba(255,255,255,.14);}

.content{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{padding:18px 28px; border-bottom:1px solid var(--line); background:var(--surface); display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:4;}
.topbar h1{font-size:19px; margin:0; font-weight:600;}
.topbar .sub{font-size:13px; color:var(--ink-soft);}

.view{display:none; padding:24px 28px 70px;}
.view.active{display:block;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
.card + .card{margin-top:16px;}
.card h2{font-size:15px; margin:0 0 12px; font-weight:600;}
.hint{font-size:12.5px; color:var(--ink-faint); line-height:1.6; margin:6px 0 0;}

.grid{display:grid; gap:16px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
button{font-family:inherit;}
.btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:6px; border:1px solid var(--line-strong); background:#fff; color:var(--ink); font-size:13.5px; cursor:pointer; white-space:nowrap;}
.btn:hover{border-color:var(--brand); color:var(--brand-dark);}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-sm{padding:5px 10px; font-size:12.5px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}

.account-card{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:#fff;}
.meta{flex:1; min-width:0;}
.name-input{font-size:14px; font-weight:600; border:none; background:transparent; width:100%; padding:2px 0; color:var(--ink);}
.stat{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.field{display:flex; flex-direction:column; gap:5px; font-size:13px;}
.field label{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
select, input[type=text], input[type=date], input[type=number]{
  border:1px solid var(--line-strong); border-radius:6px; padding:7px 10px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);
}
.filter-row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">持股追蹤儀表板</div>
      <div class="brand-sub">多帳戶 ETF／股票定期定額追蹤分析<br>GitHub Pages 雲端自動讀取版</div>
    </div>
    <nav id="navList">
      <button class="nav-item active" data-view="import">📥 匯入資料</button>
      <button class="nav-item" data-view="overview">📊 總覽</button>
      <button class="nav-item" data-view="single">🔍 單一股票分析</button>
      <button class="nav-item" data-view="compare">📈 多股票比較</button>
      <button class="nav-item" data-view="alerts">⚠️ 警示中心</button>
      <button class="nav-item" data-view="prices">💰 股價設定</button>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <h1 id="topbarTitle">匯入資料</h1>
        <div class="sub" id="topbarSub">從 GitHub 雲端自動載入 holdings 與 prices 資料夾</div>
      </div>
    </header>

    <section class="view active" id="view-import">
      <div class="card">
        <h2>📁 雲端資料庫狀態（自動從 GitHub 讀取）</h2>
        <div id="dbStatus" class="hint" style="margin-top:8px; font-weight:bold; color:var(--brand);">正在從雲端載入資料庫...</div>
      </div>

      <div class="card" id="accountsCard" style="display:none;">
        <div class="filter-row" style="margin-bottom:0;">
          <div class="field">
            <label>起始日期</label>
            <input type="date" id="importStartDate">
          </div>
          <div class="field">
            <label>結束日期</label>
            <input type="date" id="importEndDate">
          </div>
        </div>
      </div>

      <div class="card" id="accountsCard2" style="display:none;">
        <div class="card-head">
          <h2 id="accountsCard2Title">選擇要納入本次分析的帳戶 (Holdings)</h2>
          <div class="btn-row">
            <button class="btn btn-sm" data-action="run-analysis">開始分析 →</button>
          </div>
        </div>
        <div class="grid" id="accountsList" style="grid-template-columns:1fr; margin-top:16px;"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

// 持股清單檔名 (holdings資料夾)
const ACCOUNT_FILES = [
  '00402A.json',
  '00403A.json',
  '00406A.json',
  '00980A.json',
  '00981A.json',
  '00982A.json',
  '00988A.json',
  '00991A.json',
  '00992A.json'
];

// 股價資料檔名 (prices資料夾) - 備用供後續分析模組讀取
const PRICE_FILES = [
  '1303.json',
  '2303.json',
  '2313.json',
  '2345.json',
  '2368.json',
  '2408.json',
  '2449.json',
  '3189.json',
  '6488.json',
  '6669.json',
  '8210.json',
  'MRVL.json'
];

let globalDatabase = {};
let globalPrices = {};

window.addEventListener('DOMContentLoaded', async () => {
  const statusEl = document.getElementById('dbStatus');
  const accountsListEl = document.getElementById('accountsList');
  
  try {
    statusEl.textContent = "正在從 GitHub 讀取 holdings/ 與 prices/ 資料...";
    
    let loadedAccountsCount = 0;
    let loadedPricesCount = 0;

    // 1. 載入 holdings
    for (let filename of ACCOUNT_FILES) {
      try {
        const res = await fetch(`holdings/${filename}`);
        if (res.ok) {
          const data = await res.json();
          globalDatabase[filename] = data;
          loadedAccountsCount++;
        }
      } catch (err) {
        console.warn(`無法讀取 holdings/${filename}`, err);
      }
    }

    // 2. 載入 prices (供後續模組使用)
    for (let filename of PRICE_FILES) {
      try {
        const res = await fetch(`prices/${filename}`);
        if (res.ok) {
          const data = await res.json();
          globalPrices[filename] = data;
          loadedPricesCount++;
        }
      } catch (err) {
        console.warn(`無法讀取 prices/${filename}`, err);
      }
    }

    if (loadedAccountsCount > 0) {
      statusEl.textContent = `雲端資料載入就緒！已成功載入 ${loadedAccountsCount} 個持股帳戶與 ${loadedPricesCount} 檔股價資料。`;
      document.getElementById('accountsCard').style.display = 'block';
      document.getElementById('accountsCard2').style.display = 'block';

      accountsListEl.innerHTML = '';
      Object.keys(globalDatabase).forEach(acc => {
        const displayName = acc.replace('.json', ''); // 去除副檔名讓畫面更好看
        accountsListEl.innerHTML += `
          <label class="account-card" style="cursor:pointer;">
            <input type="checkbox" name="accountChk" value="${acc}" checked style="accent-color:var(--brand);">
            <div class="meta">
              <div class="name-input">${displayName}</div>
              <div class="stat">狀態：已從雲端載入</div>
            </div>
          </label>`;
      });
    } else {
      statusEl.textContent = "⚠️ 找不到任何帳戶檔案。請確定已將檔案推送到 GitHub 的 holdings/ 資料夾。";
    }
  } catch (e) {
    statusEl.textContent = "載入發生錯誤：" + e.message;
    console.error(e);
  }
});

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    const viewId = 'view-' + btn.getAttribute('data-view');
    const target = document.getElementById(viewId);
    if(target) target.classList.add('active');
  });
});

})();
</script>
</body>
</html>
